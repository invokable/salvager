name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: xdebug
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
      - name: Install Playwright
        run: vendor/bin/playwright-install --with-deps
      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser --version
          agent-browser install --with-deps
          #npm install @sparticuz/chromium
          #node ./.github/scripts/install-chromium.js > /tmp/chromium_path.txt
          #cat /tmp/chromium_path.txt
      - name: Test
        run: composer run test
        env:
          SALVAGER_AGENT_BROWSER_PATH: "agent-browser"
          #AGENT_BROWSER_EXECUTABLE_PATH: "/tmp/chromium"
